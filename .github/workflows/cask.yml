name: Validate tap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate cask and published checksum
    runs-on: macos-26
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test cask policy
        run: python3 -B -m unittest discover -s tests
      - name: Reject removal of the published cask
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BASE_SHA^{commit}"
            if git cat-file -e "$BASE_SHA:Casks/notch-pocket.rb" 2>/dev/null; then
              test -f Casks/notch-pocket.rb
            fi
          fi
      - name: Validate published cask
        if: hashFiles('Casks/notch-pocket.rb') != ''
        run: python3 -B scripts/check_cask.py --online
      - name: Audit published cask
        if: hashFiles('Casks/notch-pocket.rb') != ''
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --strict --online "$PWD/Casks/notch-pocket.rb"
      - name: Report bootstrap state
        if: hashFiles('Casks/notch-pocket.rb') == ''
        run: echo "Tap infrastructure only. No cask or installable release has been published."
